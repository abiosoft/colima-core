name: Release

on:
  push:
    tags:
      - "v*"
      - "test-v*"
  pull_request:

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  builder:
    strategy:
      max-parallel: 2
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            os: ubuntu-26.04
          - arch: arm64
            os: ubuntu-26.04-arm
    runs-on: ${{ matrix.os }}
    name: builder-${{ matrix.arch }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Cache
        id: cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: builder-${{ matrix.arch }}-${{ hashFiles('dependencies.env', 'scripts/Dockerfile') }}
          path: |
            builder-${{ matrix.arch }}.tar
            dist/
            scripts/.build-image-stamp-*

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: make deps save-builder

  image:
    strategy:
      max-parallel: 4
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
        dist: [ubuntu, debian]
        include:
          - arch: amd64
            os: ubuntu-26.04
          - arch: arm64
            os: ubuntu-26.04-arm
    runs-on: ${{ matrix.os }}
    needs: [builder]
    name: images-${{ matrix.arch }}-${{ matrix.dist }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Cache Restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: builder-${{ matrix.arch }}-${{ hashFiles('dependencies.env', 'scripts/Dockerfile') }}
          path: |
            builder-${{ matrix.arch }}.tar
            dist/
            scripts/.build-image-stamp-*
          fail-on-cache-miss: true

      - name: Build
        run: |
          docker load -i builder-${{ matrix.arch }}.tar
          make DIST=${{ matrix.dist }} --touch deps save-builder
          for rt in none docker containerd incus; do
            echo "::group::img $rt"
            make DIST=${{ matrix.dist }} "$rt"
            echo "::endgroup::"
          done
          ls -lah dist/img

      - name: Test
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install colima
          for rt in none docker containerd incus; do
            echo "::group::test $rt"
            make DIST=${{ matrix.dist }} "test-$rt"
            echo "::endgroup::"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: img-${{ matrix.arch }}-${{ matrix.dist}}
          path: dist/img/${{ matrix.dist}}-*-*.raw.*
          overwrite: true
          retention-days: 1
          compression-level: 0

  release:
    runs-on: ubuntu-26.04
    needs: [image]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/img

      - name: Create
        run: >
          tag="${GITHUB_REF##*/}"

          gh release create "${tag}" --draft --title "${tag}" dist/img/*/*.raw.gz dist/img/*/*.sha512sum

      - name: Delete build artifacts
        if: always()
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[].id' | xargs -r -I {} gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/{}

